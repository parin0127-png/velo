<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Velo — AI Business Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #08090f;
  --accent: #7c6df0;
  --accent-2: #5b8af5;
  --accent-dim: #4a3fb5;
  --surface: #111219;
  --surface-2: #181a27;
  --border: rgba(255,255,255,0.055);
  --border-accent: rgba(124,109,240,0.2);
  --text: #ecedf5;
  --text-muted: #7e8099;
  --text-dim: #454761;
  --sidebar-w: 220px;
}

html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; overflow: hidden; }

/* blobs */
.blob-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.blob { position: absolute; border-radius: 50%; filter: blur(110px); animation: drift linear infinite; }
.blob-1 { width: 520px; height: 520px; background: #5b4de8; opacity: 0.055; top: -8%; left: -4%; animation-duration: 42s; }
.blob-2 { width: 440px; height: 440px; background: #2d5fcf; opacity: 0.045; top: 45%; right: -6%; animation-duration: 55s; animation-delay: -16s; }
.blob-3 { width: 360px; height: 360px; background: #8b5cf6; opacity: 0.04; bottom: -8%; left: 38%; animation-duration: 48s; animation-delay: -28s; }
.blob-4 { width: 260px; height: 260px; background: #3b82f6; opacity: 0.028; top: 22%; right: 28%; animation-duration: 65s; animation-delay: -10s; }
@keyframes drift {
  0%   { transform: translate(0,0) scale(1); }
  25%  { transform: translate(35px,-28px) scale(1.03); }
  50%  { transform: translate(-18px,38px) scale(0.97); }
  75%  { transform: translate(-44px,-16px) scale(1.02); }
  100% { transform: translate(0,0) scale(1); }
}

/* Ghost float animation */
@keyframes ghostFloat {
  0%, 100% { transform: translateY(0px); }
  50%       { transform: translateY(-4px); }
}
@keyframes ghostFloatLg {
  0%, 100% { transform: translateY(0px); }
  50%       { transform: translateY(-7px); }
}
/* Ghost shimmer / subtle opacity pulse */
@keyframes ghostGlow {
  0%, 100% { opacity: 0.92; }
  50%       { opacity: 1; }
}

.ghost-logo {
  animation: ghostFloat 3.2s ease-in-out infinite, ghostGlow 3.2s ease-in-out infinite;
  display: block; flex-shrink: 0;
}
.ghost-logo-lg {
  animation: ghostFloatLg 3s ease-in-out infinite, ghostGlow 3s ease-in-out infinite;
  display: block;
  margin: 0 auto 22px;
}
/* topbar ghost */
.ghost-topbar {
  animation: ghostFloat 3.5s ease-in-out infinite;
  display: block;
}

.shell { position: relative; z-index: 1; display: flex; height: 100vh; }

/* Sidebar */
.sidebar {
  width: var(--sidebar-w); flex-shrink: 0;
  display: flex; flex-direction: column;
  background: rgba(10,11,18,0.78);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border-right: 1px solid var(--border);
  padding: 26px 0; position: relative; z-index: 10;
}

.logo {
  display: flex; align-items: center; gap: 12px;
  padding: 0 20px 28px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 22px;
}
.logo-text {
  font-family: 'Syne', sans-serif;
  font-weight: 700; font-size: 19px;
  letter-spacing: -0.03em; color: var(--text);
}

/* Nav */
.nav { flex: 1; display: flex; flex-direction: column; gap: 1px; padding: 0 10px; }
.nav-label { font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); padding: 12px 12px 6px; font-weight: 500; }
.nav-link {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px; border-radius: 9px;
  font-size: 13px; font-weight: 400;
  color: var(--text-muted); cursor: pointer;
  transition: all 0.18s ease; user-select: none; text-decoration: none;
}
.nav-link svg { width: 15px; height: 15px; opacity: 0.6; flex-shrink: 0; }
.nav-link:hover { background: rgba(124,109,240,0.07); color: var(--text); }
.nav-link.active { background: rgba(124,109,240,0.1); color: var(--accent); font-weight: 500; }
.nav-link.active svg { opacity: 1; }

.online-badge {
  display: flex; align-items: center; gap: 8px;
  padding: 14px 20px 0;
  border-top: 1px solid var(--border);
  font-size: 11.5px; color: var(--text-dim); font-weight: 300;
}
.pulse-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: #34d399; flex-shrink: 0;
  box-shadow: 0 0 0 0 rgba(52,211,153,0.5);
  animation: pulse-green 2.2s infinite;
}
@keyframes pulse-green {
  0%   { box-shadow: 0 0 0 0 rgba(52,211,153,0.5); }
  70%  { box-shadow: 0 0 0 7px rgba(52,211,153,0); }
  100% { box-shadow: 0 0 0 0 rgba(52,211,153,0); }
}

/* Chat area */
.chat-area { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }

.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 28px;
  border-bottom: 1px solid var(--border);
  background: rgba(8,9,15,0.65);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  flex-shrink: 0;
}
.topbar-left { display: flex; align-items: center; gap: 11px; }
.topbar-title { font-family: 'Syne', sans-serif; font-weight: 600; font-size: 14px; letter-spacing: -0.01em; color: var(--text); line-height: 1.2; }
.topbar-sub { font-size: 11px; color: var(--text-dim); font-weight: 300; margin-top: 2px; }
.topbar-right { display: flex; align-items: center; gap: 14px; }
.topbar-date { font-size: 11.5px; color: var(--text-dim); font-weight: 300; }
.status-pill {
  display: flex; align-items: center; gap: 5px;
  padding: 4px 10px; border-radius: 20px;
  background: rgba(52,211,153,0.07);
  border: 1px solid rgba(52,211,153,0.15);
  font-size: 11px; color: #6ee7b7; font-weight: 500;
}
.status-pill .dot { width: 5px; height: 5px; border-radius: 50%; background: #34d399; }

/* Messages */
.messages {
  flex: 1; overflow-y: auto;
  padding: 28px 32px 12px;
  display: flex; flex-direction: column; gap: 22px;
  scrollbar-width: thin; scrollbar-color: rgba(124,109,240,0.15) transparent;
}
.messages::-webkit-scrollbar { width: 4px; }
.messages::-webkit-scrollbar-track { background: transparent; }
.messages::-webkit-scrollbar-thumb { background: rgba(124,109,240,0.15); border-radius: 2px; }

.msg-row { display: flex; flex-direction: column; animation: fadeUp 0.26s cubic-bezier(0.22,1,0.36,1) both; }
.msg-row.user { align-items: flex-end; }
.msg-row.velo { align-items: flex-start; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

.msg-meta { display: flex; align-items: center; gap: 7px; margin-bottom: 6px; }
.msg-row.user .msg-meta { flex-direction: row-reverse; }

.msg-avatar {
  width: 24px; height: 24px; border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 600; flex-shrink: 0;
  overflow: visible;
}
.msg-avatar.velo-av {
  background: linear-gradient(135deg, #2a2060 0%, #1a2a50 100%);
  border: 1px solid rgba(124,109,240,0.25);
}
.msg-avatar.user-av {
  background: rgba(124,109,240,0.12);
  border: 1px solid rgba(124,109,240,0.22);
  color: var(--accent);
  font-family: 'Syne', sans-serif; font-size: 11px; letter-spacing: -0.02em;
}
.msg-sender { font-size: 11px; font-weight: 500; color: var(--text-dim); letter-spacing: 0.01em; }

.bubble {
  max-width: 66%; padding: 12px 16px; border-radius: 14px;
  font-size: 14px; line-height: 1.65; word-break: break-word;
}
.msg-row.user .bubble {
  background: var(--accent); color: #fff; font-weight: 400;
  border-radius: 14px 14px 3px 14px;
  box-shadow: 0 4px 22px rgba(124,109,240,0.22);
}
.msg-row.velo .bubble {
  background: var(--surface-2); border: 1px solid var(--border); color: #d8daf0;
  font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 300;
  border-radius: 3px 14px 14px 14px; letter-spacing: 0.015em;
  white-space: pre-wrap;
}

.msg-time { font-size: 10px; color: var(--text-dim); margin-top: 5px; padding: 0 2px; font-weight: 300; }
.msg-row.user .msg-time { text-align: right; }

.typing-bubble {
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 3px 14px 14px 14px;
  padding: 13px 17px; display: flex; align-items: center; gap: 5px; width: fit-content;
}
.typing-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--accent); opacity: 0.5;
  animation: typingBounce 1.3s ease-in-out infinite;
}
.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes typingBounce {
  0%,60%,100% { transform: translateY(0); opacity: 0.4; }
  30%          { transform: translateY(-7px); opacity: 1; }
}

/* Welcome */
.welcome {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center; padding: 40px;
  animation: fadeUp 0.5s ease both;
}
.welcome-title {
  font-family: 'Syne', sans-serif;
  font-size: 26px; font-weight: 700;
  letter-spacing: -0.03em; color: var(--text); margin-bottom: 10px;
}
.welcome-sub { font-size: 14px; color: var(--text-muted); font-weight: 300; max-width: 340px; line-height: 1.7; }
.welcome-chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 30px; }
.chip {
  padding: 8px 15px; border-radius: 8px;
  background: var(--surface-2); border: 1px solid var(--border);
  font-size: 12.5px; color: var(--text-muted); cursor: pointer;
  transition: all 0.18s; font-weight: 400;
}
.chip:hover { border-color: var(--border-accent); color: var(--accent); background: rgba(124,109,240,0.05); transform: translateY(-1px); }

/* Input */
.input-area {
  padding: 14px 24px 18px; flex-shrink: 0;
  border-top: 1px solid var(--border);
  background: rgba(8,9,15,0.6);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
}
.input-wrap {
  display: flex; align-items: flex-end; gap: 10px;
  background: #0e1020; border: 1px solid rgba(255,255,255,0.07);
  border-radius: 13px; padding: 10px 12px 10px 18px;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.input-wrap:focus-within { border-color: rgba(124,109,240,0.28); box-shadow: 0 0 0 3px rgba(124,109,240,0.05); }
#msgInput {
  flex: 1; background: none; border: none; outline: none;
  color: var(--text); font-family: 'DM Sans', sans-serif;
  font-size: 14px; font-weight: 300; resize: none; line-height: 1.5;
  max-height: 120px; min-height: 22px; overflow-y: auto; scrollbar-width: none;
}
#msgInput::placeholder { color: var(--text-dim); }
#msgInput::-webkit-scrollbar { display: none; }

.send-btn {
  width: 34px; height: 34px; border-radius: 9px;
  background: var(--accent); border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: all 0.18s;
  box-shadow: 0 2px 12px rgba(124,109,240,0.3);
}
.send-btn:hover { transform: scale(1.05); box-shadow: 0 4px 18px rgba(124,109,240,0.4); background: #8b7ef5; }
.send-btn:active { transform: scale(0.97); }
.send-btn svg { width: 14px; height: 14px; color: white; }
.send-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; box-shadow: none; }

.input-hint { font-size: 10.5px; color: var(--text-dim); text-align: center; margin-top: 9px; font-weight: 300; }
</style>
</head>
<body>

<div class="blob-canvas" aria-hidden="true">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div class="blob blob-4"></div>
</div>

<!-- GHOST SVG DEFINITIONS (reusable) -->
<svg width="0" height="0" style="position:absolute" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Sidebar ghost 30x36 -->
    <symbol id="ghost-sm" viewBox="0 0 60 72">
      <!-- Body -->
      <path d="
        M30 4
        C14 4 6 16 6 28
        L6 56
        C6 56 11 51 16 56
        C21 61 24 56 30 56
        C36 56 39 61 44 56
        C49 51 54 56 54 56
        L54 28
        C54 16 46 4 30 4Z
      " fill="white" fill-opacity="0.93"/>
      <!-- Left eye -->
      <ellipse cx="22" cy="28" rx="5.5" ry="6.5" fill="#1a1a2e"/>
      <!-- Right eye -->
      <ellipse cx="38" cy="28" rx="5.5" ry="6.5" fill="#1a1a2e"/>
      <!-- Subtle mouth curve -->
      <path d="M24 39 Q30 44 36 39" stroke="#1a1a2e" stroke-width="2" fill="none" stroke-linecap="round"/>
    </symbol>

    <!-- Topbar ghost tiny 20x24 -->
    <symbol id="ghost-xs" viewBox="0 0 60 72">
      <path d="
        M30 4
        C14 4 6 16 6 28
        L6 56
        C6 56 11 51 16 56
        C21 61 24 56 30 56
        C36 56 39 61 44 56
        C49 51 54 56 54 56
        L54 28
        C54 16 46 4 30 4Z
      " fill="white" fill-opacity="0.9"/>
      <ellipse cx="22" cy="28" rx="5.5" ry="6.5" fill="#1a1a2e"/>
      <ellipse cx="38" cy="28" rx="5.5" ry="6.5" fill="#1a1a2e"/>
      <path d="M24 39 Q30 44 36 39" stroke="#1a1a2e" stroke-width="2" fill="none" stroke-linecap="round"/>
    </symbol>

    <!-- Welcome ghost large 64x78 -->
    <symbol id="ghost-lg" viewBox="0 0 60 72">
      <path d="
        M30 4
        C14 4 6 16 6 28
        L6 56
        C6 56 11 51 16 56
        C21 61 24 56 30 56
        C36 56 39 61 44 56
        C49 51 54 56 54 56
        L54 28
        C54 16 46 4 30 4Z
      " fill="white" fill-opacity="0.88"/>
      <ellipse cx="22" cy="28" rx="5.5" ry="6.5" fill="#1a1a2e"/>
      <ellipse cx="38" cy="28" rx="5.5" ry="6.5" fill="#1a1a2e"/>
      <path d="M24 39 Q30 44 36 39" stroke="#1a1a2e" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    </symbol>
  </defs>
</svg>

<div class="shell">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="logo">
      <!-- Ghost logo mark in sidebar -->
      <svg class="ghost-logo" width="28" height="34" viewBox="0 0 60 72" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="ghost-glow-sm">
            <feGaussianBlur stdDeviation="2.5" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <g filter="url(#ghost-glow-sm)">
          <path d="M30 4 C14 4 6 16 6 28 L6 56 C6 56 11 51 16 56 C21 61 24 56 30 56 C36 56 39 61 44 56 C49 51 54 56 54 56 L54 28 C54 16 46 4 30 4Z"
            fill="white" fill-opacity="0.92"/>
          <ellipse cx="22" cy="28" rx="5.5" ry="6.5" fill="#0d0e1a"/>
          <ellipse cx="38" cy="28" rx="5.5" ry="6.5" fill="#0d0e1a"/>
          <path d="M24 39 Q30 44 36 39" stroke="#0d0e1a" stroke-width="2" fill="none" stroke-linecap="round"/>
        </g>
      </svg>
      <span class="logo-text">Velo</span>
    </div>

    <nav class="nav">
      <a class="nav-link active" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Chat
      </a>
    </nav>

    <div class="online-badge">
      <div class="pulse-dot"></div>
      Velo online
    </div>
  </aside>

  <!-- Chat -->
  <main class="chat-area">

    <div class="topbar">
      <div class="topbar-left">
        <!-- Ghost in topbar — tiny, floating -->
        <div style="width:30px;height:36px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <svg class="ghost-topbar" width="22" height="27" viewBox="0 0 60 72" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <filter id="ghost-glow-xs">
                <feGaussianBlur stdDeviation="1.8" result="blur"/>
                <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
            </defs>
            <g filter="url(#ghost-glow-xs)">
              <path d="M30 4 C14 4 6 16 6 28 L6 56 C6 56 11 51 16 56 C21 61 24 56 30 56 C36 56 39 61 44 56 C49 51 54 56 54 56 L54 28 C54 16 46 4 30 4Z"
                fill="white" fill-opacity="0.88"/>
              <ellipse cx="22" cy="28" rx="5.5" ry="6.5" fill="#0d0e1a"/>
              <ellipse cx="38" cy="28" rx="5.5" ry="6.5" fill="#0d0e1a"/>
              <path d="M24 39 Q30 44 36 39" stroke="#0d0e1a" stroke-width="2" fill="none" stroke-linecap="round"/>
            </g>
          </svg>
        </div>
        <div>
          <div class="topbar-title">Velo Assistant</div>
          <div class="topbar-sub">Ready to help</div>
        </div>
      </div>
      <div class="topbar-right">
        <span class="topbar-date" id="currentDate"></span>
        <div class="status-pill"><div class="dot"></div> Connected</div>
      </div>
    </div>

    <div class="messages" id="messages">
      <div class="welcome" id="welcome">

        <!-- Large ghost, slow float, semi-transparent layered look -->
        <div style="position:relative;width:80px;height:96px;margin:0 auto 24px;display:flex;align-items:center;justify-content:center;">
          <!-- Shadow ghost behind (offset, more transparent) -->
          <svg style="position:absolute;top:8px;left:8px;opacity:0.18;animation:ghostFloatLg 3s ease-in-out infinite;animation-delay:-0.6s;"
            width="72" height="86" viewBox="0 0 60 72" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M30 4 C14 4 6 16 6 28 L6 56 C6 56 11 51 16 56 C21 61 24 56 30 56 C36 56 39 61 44 56 C49 51 54 56 54 56 L54 28 C54 16 46 4 30 4Z"
              fill="#7c6df0"/>
          </svg>
          <!-- Main ghost -->
          <svg class="ghost-logo-lg" width="72" height="86" viewBox="0 0 60 72" fill="none" xmlns="http://www.w3.org/2000/svg"
            style="position:relative;z-index:2;">
            <defs>
              <filter id="ghost-glow-lg">
                <feGaussianBlur stdDeviation="3.5" result="blur"/>
                <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
            </defs>
            <g filter="url(#ghost-glow-lg)">
              <path d="M30 4 C14 4 6 16 6 28 L6 56 C6 56 11 51 16 56 C21 61 24 56 30 56 C36 56 39 61 44 56 C49 51 54 56 54 56 L54 28 C54 16 46 4 30 4Z"
                fill="white" fill-opacity="0.93"/>
              <ellipse cx="22" cy="28" rx="5.5" ry="6.5" fill="#0d0e1a"/>
              <ellipse cx="38" cy="28" rx="5.5" ry="6.5" fill="#0d0e1a"/>
              <path d="M24 39 Q30 44 36 39" stroke="#0d0e1a" stroke-width="2.2" fill="none" stroke-linecap="round"/>
            </g>
          </svg>
        </div>

        <div class="welcome-title">Good to see you.</div>
        <div class="welcome-sub">I'm Velo — your business co-pilot. Ask me anything about your clients, pipeline, or priorities.</div>
        <div class="welcome-chips">
          <div class="chip" onclick="quickSend('Summarize last quarter\'s performance')">Summarize last quarter</div>
          <div class="chip" onclick="quickSend('Draft a client follow-up email')">Draft a client email</div>
          <div class="chip" onclick="quickSend('Analyze our top 5 clients by revenue')">Analyze top clients</div>
          <div class="chip" onclick="quickSend('What should I focus on this week?')">Weekly priorities</div>
        </div>
      </div>
    </div>

    <div class="input-area">
      <div class="input-wrap">
        <textarea id="msgInput" placeholder="Ask Velo anything..." rows="1"></textarea>
        <button class="send-btn" id="sendBtn" title="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
      <div class="input-hint">Enter to send &nbsp;·&nbsp; Shift+Enter for new line</div>
    </div>

  </main>
</div>

<script>
const SESSION_ID = 'session_1';
const API_URL    = '/chat';

const messagesEl = document.getElementById('messages');
const inputEl    = document.getElementById('msgInput');
const sendBtn    = document.getElementById('sendBtn');
let   welcomeEl  = document.getElementById('welcome');

document.getElementById('currentDate').textContent = new Date().toLocaleDateString('en-US', {
  weekday: 'short', month: 'short', day: 'numeric'
});

inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
});
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
sendBtn.addEventListener('click', send);

function quickSend(text) { inputEl.value = text; send(); }
function getTime() {
  return new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
}

/* Ghost SVG for message avatars — tiny */
function ghostAvatarSVG() {
  return `<svg width="14" height="17" viewBox="0 0 60 72" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M30 4 C14 4 6 16 6 28 L6 56 C6 56 11 51 16 56 C21 61 24 56 30 56 C36 56 39 61 44 56 C49 51 54 56 54 56 L54 28 C54 16 46 4 30 4Z"
      fill="white" fill-opacity="0.9"/>
    <ellipse cx="22" cy="28" rx="5.5" ry="6.5" fill="#0d0e1a"/>
    <ellipse cx="38" cy="28" rx="5.5" ry="6.5" fill="#0d0e1a"/>
    <path d="M24 39 Q30 44 36 39" stroke="#0d0e1a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </svg>`;
}

function appendMessage(role, text) {
  if (welcomeEl) { welcomeEl.remove(); welcomeEl = null; }

  const row = document.createElement('div');
  row.className = `msg-row ${role}`;

  const meta = document.createElement('div');
  meta.className = 'msg-meta';

  const av = document.createElement('div');
  av.className = `msg-avatar ${role === 'velo' ? 'velo-av' : 'user-av'}`;
  if (role === 'velo') {
    av.innerHTML = ghostAvatarSVG();
  } else {
    av.textContent = 'U';
  }

  const snd = document.createElement('div');
  snd.className = 'msg-sender';
  snd.textContent = role === 'user' ? 'You' : 'Velo';

  meta.appendChild(av);
  meta.appendChild(snd);

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML =  text.replace(/\n/g, '<br>').replace(
    /(\/download\/[^\s<]+)/g,
    '<a href="$1" target="_blank" style="color:#a78bfa;text-decoration:underline;">⬇ Download File</a>'
);

  const time = document.createElement('div');
  time.className = 'msg-time';
  time.textContent = getTime();

  row.appendChild(meta);
  row.appendChild(bubble);
  row.appendChild(time);
  messagesEl.appendChild(row);
  scrollBottom();
}

function showTyping() {
  const row = document.createElement('div');
  row.className = 'msg-row velo';
  row.id = 'typing-indicator';

  const meta = document.createElement('div');
  meta.className = 'msg-meta';
  const av = document.createElement('div');
  av.className = 'msg-avatar velo-av';
  av.innerHTML = ghostAvatarSVG();
  const snd = document.createElement('div');
  snd.className = 'msg-sender';
  snd.textContent = 'Velo';
  meta.appendChild(av); meta.appendChild(snd);

  const tb = document.createElement('div');
  tb.className = 'typing-bubble';
  for (let i = 0; i < 3; i++) {
    const d = document.createElement('div');
    d.className = 'typing-dot';
    tb.appendChild(d);
  }

  row.appendChild(meta);
  row.appendChild(tb);
  messagesEl.appendChild(row);
  scrollBottom();
}

function removeTyping() {
  const t = document.getElementById('typing-indicator');
  if (t) t.remove();
}

function scrollBottom() {
  messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: 'smooth' });
}

function setLoading(on) {
  sendBtn.disabled = on;
  inputEl.disabled = on;
}

async function send() {
  const text = inputEl.value.trim();
  if (!text) return;

  appendMessage('user', text);
  inputEl.value = '';
  inputEl.style.height = 'auto';
  setLoading(true);
  showTyping();

  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ message: text, session_id: SESSION_ID })
    });
    if (!res.ok) throw new Error(`Server ${res.status}`);
    const data = await res.json();
    removeTyping();
    const reply = data.response || data.message || data.reply
      || (typeof data === 'string' ? data : JSON.stringify(data));
    appendMessage('velo', reply);
  } catch (err) {
    removeTyping();
    appendMessage('velo', `Could not reach the backend — ${err.message}. Make sure your FastAPI server is running at ${API_URL}.`);
  } finally {
    setLoading(false);
    inputEl.focus();
  }
}

inputEl.focus();
</script>
