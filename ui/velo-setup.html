<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Velo — Setup</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #08090f;
      --violet: #7c6df0;
      --blue: #3b82f6;
      --accent: #7c6df0;
      --accent-glow: rgba(124,109,240,0.18);
      --card-bg: rgba(255,255,255,0.03);
      --border: rgba(255,255,255,0.08);
      --text: #eceaf8;
      --muted: rgba(236,234,248,0.45);
      --input-bg: rgba(124,109,240,0.06);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      overflow-x: hidden;
    }

    /* ── animated blobs ── */
    .blobs {
      position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
    }
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.18;
      animation: drift linear infinite;
    }
    .blob-1 { width: 520px; height: 520px; background: #7c6df0; top: -10%; left: -10%; animation-duration: 28s; }
    .blob-2 { width: 380px; height: 380px; background: #3b82f6; bottom: -8%; right: -6%; animation-duration: 36s; animation-delay: -12s; }
    .blob-3 { width: 280px; height: 280px; background: #a78bfa; top: 40%; left: 60%; animation-duration: 22s; animation-delay: -8s; }

    @keyframes drift {
      0%   { transform: translate(0, 0) scale(1); }
      33%  { transform: translate(40px, -30px) scale(1.05); }
      66%  { transform: translate(-20px, 40px) scale(0.97); }
      100% { transform: translate(0, 0) scale(1); }
    }

    /* ── layout ── */
    .page {
      position: relative; z-index: 1;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 32px 16px;
      animation: fadeUp 0.7s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── card ── */
    .card {
      width: 100%; max-width: 480px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 36px 36px;
      backdrop-filter: blur(24px);
      box-shadow: 0 0 60px rgba(124,109,240,0.10), 0 24px 64px rgba(0,0,0,0.6);
    }

    /* ── logo ── */
    .logo-row {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      margin-bottom: 28px;
    }

    /* SVG ghost matching the screenshot */
    .ghost-wrap {
      position: relative; width: 48px; height: 54px;
    }
    .ghost-svg { width: 48px; height: 54px; filter: drop-shadow(0 0 14px rgba(124,109,240,0.7)); }

    .brand {
      font-family: 'Syne', sans-serif;
      font-size: 28px; font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text);
    }
    .brand span { color: var(--violet); }

    /* ── heading ── */
    .heading { text-align: center; margin-bottom: 28px; }
    .heading h1 {
      font-family: 'Syne', sans-serif;
      font-size: 22px; font-weight: 700;
      margin-bottom: 6px;
    }
    .heading p {
      font-size: 14px; color: var(--muted); font-weight: 400;
    }

    /* ── divider ── */
    .divider {
      height: 1px; background: var(--border); margin-bottom: 24px;
    }

    /* ── fields ── */
    .field { margin-bottom: 18px; }
    .field-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 6px;
    }
    label {
      font-size: 12px; font-weight: 500; letter-spacing: 0.4px;
      color: rgba(241,236,230,0.65); text-transform: uppercase;
    }
    .get-key {
      font-size: 11px; color: var(--blue);
      text-decoration: none; font-weight: 500;
      opacity: 0.85; transition: opacity .2s;
    }
    .get-key:hover { opacity: 1; }

    .input-wrap {
      position: relative; display: flex; align-items: center;
    }
    input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 40px 11px 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px; color: var(--text);
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    input::placeholder { color: rgba(241,236,230,0.28); }
    input:focus {
      border-color: rgba(124,109,240,0.55);
      box-shadow: 0 0 0 3px rgba(124,109,240,0.10), 0 0 18px rgba(59,130,246,0.08);
    }
    input[type="email"] { padding-right: 14px; }

    .toggle-eye {
      position: absolute; right: 12px;
      background: none; border: none; cursor: pointer;
      color: var(--muted); padding: 4px;
      display: flex; align-items: center; justify-content: center;
      transition: color .2s;
    }
    .toggle-eye:hover { color: var(--violet); }
    .toggle-eye svg { width: 16px; height: 16px; }

    /* ── button ── */
    .launch-btn {
      width: 100%; margin-top: 8px;
      padding: 14px;
      background: linear-gradient(135deg, var(--violet) 0%, var(--blue) 100%);
      color: #fff;
      font-family: 'Syne', sans-serif;
      font-size: 15px; font-weight: 700;
      letter-spacing: 0.2px;
      border: none; border-radius: 12px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: opacity .2s, transform .15s, box-shadow .2s;
      box-shadow: 0 4px 28px rgba(124,109,240,0.35);
    }
    .launch-btn:hover {
      opacity: 0.92;
      box-shadow: 0 6px 36px rgba(59,130,246,0.4);
      transform: translateY(-1px);
    }
    .launch-btn:active { transform: translateY(0); }
    .launch-btn:disabled {
      cursor: not-allowed; opacity: 0.75;
    }

    /* spinner */
    .spinner {
      display: none;
      width: 18px; height: 18px;
      border: 2.5px solid rgba(255,255,255,0.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── footer note ── */
    .foot-note {
      margin-top: 18px; text-align: center;
      font-size: 11.5px; color: rgba(241,236,230,0.25);
      line-height: 1.6;
    }
    .foot-note a { color: var(--violet); opacity: 0.7; text-decoration: none; }
    .foot-note a:hover { opacity: 1; }

    /* ghost wave animation */
    @keyframes ghostFloat {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-5px); }
    }
    .ghost-wrap { animation: ghostFloat 3.2s ease-in-out infinite; }
  </style>
</head>
<body>

<div class="blobs">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>

<div class="page">
  <div class="card">

    <!-- Logo -->
    <div class="logo-row">
      <div class="ghost-wrap">
        <!-- Ghost SVG matching the screenshot: rounded dome head, wavy bottom, oval eyes, smile -->
        <svg class="ghost-svg" viewBox="0 0 80 90" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="bodyGrad" cx="50%" cy="38%" r="55%">
              <stop offset="0%" stop-color="#ffffff"/>
              <stop offset="100%" stop-color="#c4bef5"/>
            </radialGradient>
            <radialGradient id="glowGrad" cx="50%" cy="40%" r="50%">
              <stop offset="0%" stop-color="#7c6df0" stop-opacity="0.45"/>
              <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <!-- ambient glow -->
          <ellipse cx="40" cy="44" rx="36" ry="38" fill="url(#glowGrad)"/>
          <!-- ghost body with wavy bottom -->
          <path d="
            M10 44
            C10 22 22 8 40 8
            C58 8 70 22 70 44
            L70 78
            C65 73 60 78 55 73
            C50 68 45 73 40 78
            C35 73 30 68 25 73
            C20 78 15 73 10 78
            Z
          " fill="url(#bodyGrad)"/>
          <!-- left eye -->
          <ellipse cx="29" cy="44" rx="7.5" ry="9" fill="#1a1028"/>
          <!-- right eye -->
          <ellipse cx="51" cy="44" rx="7.5" ry="9" fill="#1a1028"/>
          <!-- smile -->
          <path d="M31 60 Q40 68 49 60" stroke="#1a1028" stroke-width="3" stroke-linecap="round" fill="none"/>
        </svg>
      </div>
      <div class="brand">Vel<span>o</span></div>
    </div>

    <!-- Heading -->
    <div class="heading">
      <h1>Welcome to Velo</h1>
      <p>Let's get you set up in 30 seconds</p>
    </div>

    <div class="divider"></div>

    <!-- Form -->
    <div class="field">
      <div class="field-header">
        <label for="groq-key">Groq API Key</label>
        <a href="https://console.groq.com/keys" target="_blank" class="get-key">Get key ↗</a>
      </div>
      <div class="input-wrap">
        <input type="password" id="groq-key" placeholder="gsk_..." autocomplete="off"/>
        <button class="toggle-eye" onclick="toggleVis('groq-key', this)" aria-label="Show/hide">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-icon"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <div class="field">
      <div class="field-header">
        <label for="mistral-key">Mistral API Key</label>
        <a href="https://console.mistral.ai/api-keys/" target="_blank" class="get-key">Get key ↗</a>
      </div>
      <div class="input-wrap">
        <input type="password" id="mistral-key" placeholder="sk-..." autocomplete="off"/>
        <button class="toggle-eye" onclick="toggleVis('mistral-key', this)" aria-label="Show/hide">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-icon"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <div class="field">
      <div class="field-header">
        <label for="tavily-key">Tavily API Key</label>
        <a href="https://app.tavily.com/home" target="_blank" class="get-key">Get key ↗</a>
      </div>
      <div class="input-wrap">
        <input type="password" id="tavily-key" placeholder="tvly-..." autocomplete="off"/>
        <button class="toggle-eye" onclick="toggleVis('tavily-key', this)" aria-label="Show/hide">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-icon"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <div class="field">
      <div class="field-header">
        <label for="gmail">Gmail Address</label>
      </div>
      <div class="input-wrap">
        <input type="email" id="gmail" placeholder="you@gmail.com" autocomplete="off"/>
      </div>
    </div>

    <div class="field">
      <div class="field-header">
        <label for="gmail-pass">Gmail App Password</label>
        <a href="https://myaccount.google.com/apppasswords" target="_blank" class="get-key">Get password ↗</a>
      </div>
      <div class="input-wrap">
        <input type="password" id="gmail-pass" placeholder="xxxx xxxx xxxx xxxx" autocomplete="off"/>
        <button class="toggle-eye" onclick="toggleVis('gmail-pass', this)" aria-label="Show/hide">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-icon"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <!-- Launch button -->
    <button class="launch-btn" id="launchBtn" onclick="handleLaunch()">
      <span id="btnText">Launch Velo →</span>
      <div class="spinner" id="spinner"></div>
    </button>

    <p class="foot-note">
      Keys are stored locally in your browser only.<br/>
      <a href="https://docs.velo.ai" target="_blank">Read the docs</a> · <a href="https://github.com/velo-ai" target="_blank">GitHub</a>
    </p>
  </div>
</div>

<script>
  // Eye toggle
  const eyeOpen = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
  const eyeClosed = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;

  function toggleVis(id, btn) {
    const inp = document.getElementById(id);
    if (inp.type === 'password') {
      inp.type = 'text';
      btn.innerHTML = eyeClosed;
    } else {
      inp.type = 'password';
      btn.innerHTML = eyeOpen;
    }
  }

  async function handleLaunch() {
    const btn = document.getElementById('launchBtn');
    const txt = document.getElementById('btnText');
    const spin = document.getElementById('spinner');

    btn.disabled = true;
    txt.textContent = 'Setting up…';
    spin.style.display = 'block';

    const res = await fetch('/setup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            groq_key: document.getElementById('groq-key').value,
            mistral_key: document.getElementById('mistral-key').value,
            tavily_key: document.getElementById('tavily-key').value,
            gmail: document.getElementById('gmail').value,
            gmail_password: document.getElementById('gmail-pass').value
        }),
        redirect: 'follow'
    });

    window.location.href = '/';
}
</script>
</body>
</html>
